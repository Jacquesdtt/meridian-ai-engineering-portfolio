name: Educational web app

on:
  push:
    paths:
      - 'educational_web_app/**'
      - '.github/workflows/educational-web-app.yml'
  pull_request:
    paths:
      - 'educational_web_app/**'
      - '.github/workflows/educational-web-app.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: educational_web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: educational_web_app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
